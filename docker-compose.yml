services:
  web:
    build: .
    image: cinta-sigit-wedding
    container_name: cinta-sigit-wedding
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Admin dashboard (HTTP Basic Auth) — set these in a .env file next to
      # this compose file. Defaults are intentionally weak; override them.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      # Persist the SQLite database across container rebuilds/restarts.
      - rsvp_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rsvp_data:
